global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: producer
    static_configs: [{ targets: ["stream-sim:8001"] }]
  - job_name: streaming
    static_configs: [{ targets: ["streaming:8002"] }]
